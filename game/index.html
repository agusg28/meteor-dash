<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>METEOR DASH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #050510;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 1080px; max-height: 1920px;
    margin: 0 auto;
    background: #050510;
    overflow: hidden;
  }
  /* Hide the pointer over the playfield: the ship is flown with keys or
     pointer-drag, and a visible cursor distracts from the game. */
  canvas { display: block; width: 100%; height: 100%; cursor: none; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #fff;
    background: rgba(5, 5, 16, 0.72);
    z-index: 10; padding: 20px;
  }
  .hidden { display: none !important; }
  h1.title {
    font-size: clamp(44px, 11vw, 96px);
    font-weight: 900; letter-spacing: 4px; line-height: 1.05;
    color: #00f0ff;
    text-shadow: 0 0 12px #00f0ff, 0 0 42px #00f0ff, 0 0 80px #0088ff;
  }
  h1.title .dash { color: #ff2ea6; text-shadow: 0 0 12px #ff2ea6, 0 0 42px #ff2ea6, 0 0 80px #ff0066; }
  .sub {
    margin-top: 10px;
    font-size: clamp(15px, 3.4vw, 26px);
    color: #c9f6ff; letter-spacing: 2px;
  }
  .keys {
    margin-top: 26px;
    font-size: clamp(14px, 3vw, 22px);
    color: #9aa3c7; line-height: 1.9;
  }
  .keys b { color: #ffe14d; }
  .btn {
    margin-top: 34px;
    font-size: clamp(20px, 4.6vw, 32px);
    font-weight: 800; letter-spacing: 3px;
    color: #050510; background: #00f0ff;
    border: none; border-radius: 999px;
    padding: 16px 52px; cursor: pointer;
    box-shadow: 0 0 24px #00f0ff, 0 0 60px rgba(0,240,255,.55);
    font-family: inherit;
  }
  .btn:active { transform: scale(.96); }
  .btn.pink { background: #ff2ea6; box-shadow: 0 0 24px #ff2ea6, 0 0 60px rgba(255,46,166,.55); color: #fff; }
  #finalScore {
    font-size: clamp(52px, 13vw, 110px);
    font-weight: 900; color: #ffe14d;
    text-shadow: 0 0 16px #ffe14d, 0 0 50px rgba(255,225,77,.7);
    line-height: 1.1; margin-top: 6px;
  }
  #finalStats {
    margin-top: 10px;
    font-size: clamp(15px, 3.4vw, 24px);
    color: #c9f6ff; line-height: 1.8;
  }
  #finalStats b { color: #ffe14d; }
  .over-title {
    font-size: clamp(40px, 10vw, 88px);
    font-weight: 900; letter-spacing: 3px; color: #ff2ea6;
    text-shadow: 0 0 14px #ff2ea6, 0 0 48px #ff0066;
  }
  #demoBadge {
    position: absolute; top: 12px; right: 14px; z-index: 5;
    font-size: clamp(13px, 2.8vw, 20px); font-weight: 800; letter-spacing: 2px;
    color: #050510; background: #ffe14d; border-radius: 999px;
    padding: 6px 14px; box-shadow: 0 0 16px rgba(255,225,77,.8);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="demoBadge" class="hidden">DEMO · AUTOPLAY</div>

  <div id="startScreen" class="overlay">
    <h1 class="title">METEOR<br><span class="dash">DASH</span></h1>
    <div class="sub">DODGE THE METEORS &middot; GRAB THE STARS</div>
    <div class="keys">
      <b>&larr; &uarr; &darr; &rarr;</b> / <b>WASD</b> to fly<br>
      <b>Touch &amp; drag</b> to fly<br>
      3 lives &middot; stars build your <b>combo</b>
    </div>
    <button id="startBtn" class="btn">▶&nbsp; START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="over-title">GAME OVER</div>
    <div class="sub">FINAL SCORE</div>
    <div id="finalScore">0</div>
    <div id="finalStats"></div>
    <button id="restartBtn" class="btn pink">↻&nbsp; PLAY AGAIN</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var startScreen = document.getElementById("startScreen");
  var gameOverScreen = document.getElementById("gameOverScreen");
  var startBtn = document.getElementById("startBtn");
  var restartBtn = document.getElementById("restartBtn");
  var finalScoreEl = document.getElementById("finalScore");
  var finalStatsEl = document.getElementById("finalStats");
  var demoBadge = document.getElementById("demoBadge");

  // ---------- sizing (portrait-friendly, fits 1080x1920) ----------
  var W = 0, H = 0, DPR = 1, SCALE = 1;
  function resize() {
    var r = wrap.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.floor(r.width));
    H = Math.max(480, Math.floor(r.height));
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SCALE = Math.min(W / 540, H / 960); // base design 540x960
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- state ----------
  var STATE = { MENU: 0, PLAYING: 1, OVER: 2 };
  var state = STATE.MENU;
  var score = 0, lives = 3, combo = 0, bestCombo = 0, starsCollected = 0;
  var meteors = [], stars = [], particles = [], bgStars = [];
  var meteorTimer = 0, starTimer = 0, elapsed = 0;
  var shake = 0, flash = 0, invuln = 0;
  var lastTime = 0;

  var ship = {
    x: 0, y: 0, vx: 0, vy: 0,
    w: 46, h: 40, // design units, scaled at draw
    speed: 560
  };

  var keys = {};
  var pointer = { active: false, x: 0, y: 0 };

  // starfield background
  for (var i = 0; i < 110; i++) {
    bgStars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.8 + 0.4,
      s: Math.random() * 30 + 8,
      tw: Math.random() * Math.PI * 2
    });
  }

  function resetGame() {
    score = 0; lives = 3; combo = 0; bestCombo = 0; starsCollected = 0;
    meteors = []; stars = []; particles = [];
    meteorTimer = 0.5; starTimer = 0.4; elapsed = 0;
    shake = 0; flash = 0; invuln = 2;
    ship.x = W / 2; ship.y = H - 130 * SCALE;
    ship.vx = 0; ship.vy = 0;
  }

  function startGame() {
    resetGame();
    state = STATE.PLAYING;
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    if (DEMO) demoBadge.classList.remove("hidden");
  }

  function gameOver() {
    state = STATE.OVER;
    finalScoreEl.textContent = score;
    finalStatsEl.innerHTML =
      "Stars collected: <b>" + starsCollected + "</b><br>" +
      "Best combo: <b>x" + Math.max(1, bestCombo) + "</b><br>" +
      "Survived: <b>" + elapsed.toFixed(1) + "s</b>";
    gameOverScreen.classList.remove("hidden");
    demoBadge.classList.add("hidden");
  }

  // ---------- input ----------
  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].indexOf(e.code) !== -1) e.preventDefault();
    if ((e.code === "Enter" || e.code === "Space") && state !== STATE.PLAYING) startGame();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", function (e) {
    pointer.active = true;
    var p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!pointer.active) return;
    var p = pointerPos(e); pointer.x = p.x; pointer.y = p.y;
    e.preventDefault();
  });
  window.addEventListener("pointerup", function () { pointer.active = false; });
  window.addEventListener("pointercancel", function () { pointer.active = false; });

  startBtn.addEventListener("click", startGame);
  restartBtn.addEventListener("click", startGame);

  // ---------- spawning ----------
  function spawnMeteor() {
    var r = (14 + Math.random() * 26) * SCALE;
    meteors.push({
      x: r + Math.random() * (W - 2 * r),
      y: -r - 10,
      r: r,
      vy: (170 + Math.random() * 190 + elapsed * 6) * SCALE,
      vx: (Math.random() - 0.5) * 60 * SCALE,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 3,
      hue: Math.random() < 0.7 ? 16 : 350 // orange-red, sometimes magenta
    });
  }

  function spawnStar() {
    var r = 13 * SCALE;
    stars.push({
      x: r + 10 + Math.random() * (W - 2 * r - 20),
      y: -r - 10,
      r: r,
      vy: (150 + Math.random() * 60) * SCALE,
      rot: Math.random() * Math.PI * 2,
      vr: 2.2
    });
  }

  function explode(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (40 + Math.random() * power) * SCALE;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.5, maxLife: 1,
        r: (1.5 + Math.random() * 3) * SCALE,
        color: color
      });
    }
    for (var j = 0; j < particles.length; j++) particles[j].maxLife = Math.max(particles[j].maxLife, particles[j].life);
  }

  function hitShip() {
    if (invuln > 0) return;
    lives--;
    combo = 0;
    shake = 16 * SCALE;
    flash = 0.35;
    invuln = 2;
    explode(ship.x, ship.y, "#ff2ea6", 42, 320);
    explode(ship.x, ship.y, "#00f0ff", 24, 220);
    if (lives <= 0) gameOver();
  }

  // ---------- demo autopilot ----------
  function demoSteer(dt) {
    // Target: nearest star below the ship if safe, else dodge nearest threatening meteor.
    var tx = ship.x, ty = ship.y;
    var threat = null, threatD = Infinity;
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      var dy = ship.y - m.y;
      if (dy > -40 && dy < 340 * SCALE) {
        var d = Math.abs(m.x - ship.x);
        if (d < threatD) { threatD = d; threat = m; }
      }
    }
    var bestStar = null, bestScore = Infinity;
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      if (s.y < ship.y + 40 * SCALE) {
        var sc = (ship.y - s.y) + Math.abs(s.x - ship.x) * 0.6;
        if (sc < bestScore) { bestScore = sc; bestStar = s; }
      }
    }
    if (threat && threatD < 110 * SCALE) {
      // dodge: move away from the meteor, preferring the side with more room
      var dir = (threat.x >= ship.x) ? -1 : 1;
      if (ship.x < 80 * SCALE) dir = 1;
      if (ship.x > W - 80 * SCALE) dir = -1;
      tx = ship.x + dir * 160 * SCALE;
      ty = ship.y;
    } else if (bestStar) {
      tx = bestStar.x; ty = bestStar.y + 30 * SCALE;
    } else {
      tx = W / 2; ty = ship.y;
    }
    tx = Math.max(30 * SCALE, Math.min(W - 30 * SCALE, tx));
    ty = Math.max(H * 0.35, Math.min(H - 90 * SCALE, ty));
    var dx = tx - ship.x, dy2 = ty - ship.y;
    var dist = Math.sqrt(dx * dx + dy2 * dy2) || 1;
    var sp = ship.speed * 1.05;
    ship.vx = (dx / dist) * Math.min(sp, dist / Math.max(dt, 0.001));
    ship.vy = (dy2 / dist) * Math.min(sp, dist / Math.max(dt, 0.001));
    if (dist < 6) { ship.vx = 0; ship.vy = 0; }
  }

  // ---------- update ----------
  function update(dt) {
    elapsed += dt;

    // difficulty ramp: faster spawns over time
    meteorTimer -= dt;
    if (meteorTimer <= 0) {
      spawnMeteor();
      meteorTimer = Math.max(0.28, 0.85 - elapsed * 0.012) * (0.7 + Math.random() * 0.6);
      if (Math.random() < 0.3) spawnMeteor(); // occasional double
    }
    starTimer -= dt;
    if (starTimer <= 0) {
      spawnStar();
      starTimer = 0.7 + Math.random() * 0.9;
    }

    // --- ship movement ---
    if (DEMO) {
      demoSteer(dt);
    } else if (pointer.active) {
      var dx = pointer.x - ship.x, dy = pointer.y - ship.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 4) {
        var sp = ship.speed;
        ship.vx = (dx / d) * Math.min(sp, d / Math.max(dt, 0.001));
        ship.vy = (dy / d) * Math.min(sp, d / Math.max(dt, 0.001));
      } else { ship.vx = 0; ship.vy = 0; }
    } else {
      var ax = 0, ay = 0;
      if (keys["ArrowLeft"] || keys["KeyA"]) ax -= 1;
      if (keys["ArrowRight"] || keys["KeyD"]) ax += 1;
      if (keys["ArrowUp"] || keys["KeyW"]) ay -= 1;
      if (keys["ArrowDown"] || keys["KeyS"]) ay += 1;
      var len = Math.sqrt(ax * ax + ay * ay) || 1;
      ship.vx = (ax / len) * ship.speed;
      ship.vy = (ay / len) * ship.speed;
    }
    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;
    var m = 28 * SCALE;
    ship.x = Math.max(m, Math.min(W - m, ship.x));
    ship.y = Math.max(H * 0.3, Math.min(H - m, ship.y));

    // --- meteors ---
    for (var i = meteors.length - 1; i >= 0; i--) {
      var mt = meteors[i];
      mt.y += mt.vy * dt;
      mt.x += mt.vx * dt;
      mt.rot += mt.vr * dt;
      if (mt.y - mt.r > H + 20 || mt.x < -60 || mt.x > W + 60) { meteors.splice(i, 1); continue; }
      var ddx = mt.x - ship.x, ddy = mt.y - ship.y;
      var rr = mt.r + 16 * SCALE;
      if (ddx * ddx + ddy * ddy < rr * rr) {
        meteors.splice(i, 1);
        hitShip();
        if (state !== STATE.PLAYING) return;
      }
    }

    // --- stars ---
    for (var j = stars.length - 1; j >= 0; j--) {
      var st = stars[j];
      st.y += st.vy * dt;
      st.rot += st.vr * dt;
      if (st.y - st.r > H + 20) { stars.splice(j, 1); continue; }
      var sdx = st.x - ship.x, sdy = st.y - ship.y;
      var srr = st.r + 22 * SCALE;
      if (sdx * sdx + sdy * sdy < srr * srr) {
        stars.splice(j, 1);
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        starsCollected++;
        var mult = Math.min(combo, 8);
        score += 10 * mult;
        explode(st.x, st.y, "#ffe14d", 16, 160);
      }
    }

    // --- particles ---
    for (var k = particles.length - 1; k >= 0; k--) {
      var p = particles[k];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(k, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.98; p.vy *= 0.98;
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 60 * SCALE);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.4);
    if (invuln > 0) invuln -= dt;
  }

  // ---------- drawing ----------
  function drawShip(x, y, tilt) {
    var s = SCALE;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    // engine flame
    var fl = 10 + Math.sin(performance.now() / 60) * 4;
    ctx.beginPath();
    ctx.moveTo(-7 * s, 14 * s);
    ctx.lineTo(0, (16 + fl) * s);
    ctx.lineTo(7 * s, 14 * s);
    ctx.closePath();
    ctx.fillStyle = "#ff9d00";
    ctx.shadowColor = "#ff9d00"; ctx.shadowBlur = 14 * s;
    ctx.fill();
    // body
    ctx.beginPath();
    ctx.moveTo(0, -22 * s);
    ctx.lineTo(15 * s, 10 * s);
    ctx.lineTo(7 * s, 16 * s);
    ctx.lineTo(-7 * s, 16 * s);
    ctx.lineTo(-15 * s, 10 * s);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, -22 * s, 0, 16 * s);
    g.addColorStop(0, "#7df9ff");
    g.addColorStop(1, "#0066ff");
    ctx.fillStyle = g;
    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 18 * s;
    ctx.fill();
    // cockpit
    ctx.beginPath();
    ctx.arc(0, -4 * s, 5.5 * s, 0, Math.PI * 2);
    ctx.fillStyle = "#ffe14d";
    ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 10 * s;
    ctx.fill();
    ctx.restore();
  }

  function drawMeteor(mt) {
    var s = SCALE;
    ctx.save();
    ctx.translate(mt.x, mt.y);
    ctx.rotate(mt.rot);
    ctx.beginPath();
    var spikes = 9;
    for (var i = 0; i < spikes * 2; i++) {
      var ang = (i / (spikes * 2)) * Math.PI * 2;
      var rad = (i % 2 === 0) ? mt.r : mt.r * 0.72;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = mt.hue === 16 ? "#b34724" : "#8a1f5c";
    ctx.shadowColor = mt.hue === 16 ? "#ff5a1f" : "#ff2ea6";
    ctx.shadowBlur = 14 * s;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-mt.r * 0.25, -mt.r * 0.2, mt.r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,180,120,0.5)";
    ctx.shadowBlur = 0;
    ctx.fill();
    ctx.restore();
  }

  function drawStarShape(st) {
    var s = SCALE;
    ctx.save();
    ctx.translate(st.x, st.y);
    ctx.rotate(st.rot);
    ctx.beginPath();
    var spikes = 5;
    for (var i = 0; i < spikes * 2; i++) {
      var ang = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      var rad = (i % 2 === 0) ? st.r : st.r * 0.45;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "#ffe14d";
    ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 16 * s;
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    var s = SCALE;
    var pad = 16 * s;
    ctx.textBaseline = "top";
    // score — big and readable
    ctx.font = "900 " + Math.round(52 * s) + "px 'Segoe UI', Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 18 * s;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(String(score), W / 2, pad);
    ctx.shadowBlur = 0;
    // combo
    if (combo >= 2) {
      ctx.font = "800 " + Math.round(24 * s) + "px 'Segoe UI', Arial, sans-serif";
      ctx.fillStyle = "#ffe14d";
      ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 10 * s;
      ctx.fillText("COMBO x" + Math.min(combo, 8), W / 2, pad + 58 * s);
      ctx.shadowBlur = 0;
    }
    // lives (hearts, top-left)
    ctx.textAlign = "left";
    ctx.font = Math.round(30 * s) + "px 'Segoe UI', Arial, sans-serif";
    var hearts = "";
    for (var i = 0; i < 3; i++) hearts += (i < lives) ? "♥" : "♡";
    ctx.shadowColor = "#ff2ea6"; ctx.shadowBlur = 12 * s;
    ctx.fillStyle = "#ff2ea6";
    ctx.fillText(hearts, pad, pad + 4 * s);
    ctx.shadowBlur = 0;
    // demo label drawn in DOM; nothing else here
  }

  function drawBackground(t) {
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, W, H);
    // nebula blobs
    var neb = [
      [0.2, 0.25, 0.45, "rgba(90,0,160,0.20)"],
      [0.85, 0.6, 0.5, "rgba(0,60,140,0.18)"],
      [0.5, 0.85, 0.4, "rgba(160,0,90,0.14)"]
    ];
    for (var i = 0; i < neb.length; i++) {
      var n = neb[i];
      var rg = ctx.createRadialGradient(n[0] * W, n[1] * H, 0, n[0] * W, n[1] * H, n[2] * W);
      rg.addColorStop(0, n[3]);
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }
    // twinkling stars
    for (var j = 0; j < bgStars.length; j++) {
      var b = bgStars[j];
      var a = 0.35 + 0.65 * Math.abs(Math.sin(t / 1000 * (b.s / 20) + b.tw));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(b.x * W, b.y * H, b.r * SCALE, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
    }
    drawBackground(t);

    for (var i = 0; i < stars.length; i++) drawStarShape(stars[i]);
    for (var j = 0; j < meteors.length; j++) drawMeteor(meteors[j]);

    // particles
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === STATE.PLAYING) {
      // blink while invulnerable after a hit
      if (invuln <= 0 || Math.floor(t / 120) % 2 === 0) {
        var tilt = Math.max(-0.3, Math.min(0.3, ship.vx / 900));
        drawShip(ship.x, ship.y, tilt);
      }
    } else if (state === STATE.MENU) {
      // idle ship bobbing on the menu behind the overlay
      drawShip(W / 2, H - 130 * SCALE + Math.sin(t / 400) * 8 * SCALE, 0);
    }

    if (state === STATE.PLAYING) drawHUD();

    ctx.restore();

    // red damage flash
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,40,80," + (flash * 0.55).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- main loop (60fps target via rAF) ----------
  function loop(t) {
    requestAnimationFrame(loop);
    var dt = lastTime ? Math.min((t - lastTime) / 1000, 0.05) : 0.016;
    lastTime = t;
    if (state === STATE.PLAYING) update(dt);
    draw(t);
  }

  // menu idle state
  ship.x = W / 2; ship.y = H - 130 * SCALE;

  if (DEMO) {
    demoBadge.classList.remove("hidden");
    startGame(); // autoplay straight in, no click needed
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
